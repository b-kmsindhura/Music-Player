<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="#0b0f19" opacity="0.88" />

  <!-- Outer Vinyl Rim -->
  <circle cx="256" cy="256" r="190" fill="#131826" stroke="url(#neonGrad)" stroke-width="6" filter="url(#glow)" />

  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#252d42" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1f2638" stroke-width="1.5" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#252d42" stroke-width="2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#1f2638" stroke-width="1.5" />

  <!-- Center Label -->
  <circle cx="256" cy="256" r="75" fill="url(#centerGrad)" stroke="#c084fc" stroke-width="4" />

  <!-- Spindle Hole -->
  <circle cx="256" cy="256" r="22" fill="#0b0f19" stroke="#ffffff" stroke-width="3" />

  <!-- Waveform accents -->
  <path d="M 234 160 Q 256 140 278 160" stroke="#a5b4fc" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 220 140 Q 256 115 292 140" stroke="#c084fc" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 234 352 Q 256 372 278 352" stroke="#a5b4fc" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 220 372 Q 256 397 292 372" stroke="#c084fc" stroke-width="3.5" fill="none" stroke-linecap="round" />
</svg>
